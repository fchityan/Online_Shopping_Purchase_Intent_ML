apiVersion: v1
kind: ConfigMap
metadata: {name: purchase-intent-api-config}
data:
  SERVICE_ENV: production
  LOG_LEVEL: INFO
  MODEL_PATH: /app/outputs/model_bundle.joblib
  MAX_BATCH_SIZE: "100"
  ENABLE_DOCS: "false"
  REQUIRE_API_KEY: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: purchase-intent-api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: purchase-intent-api}
  template:
    metadata:
      labels: {app: purchase-intent-api}
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: ghcr.io/fchityan/online-shopping-purchase-intent-ml:latest
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: purchase-intent-api-config}
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef: {name: purchase-intent-api-secrets, key: api-key}
            - name: MODEL_SHA256
              valueFrom:
                secretKeyRef: {name: purchase-intent-api-secrets, key: model-sha256, optional: true}
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /live, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {cpu: "1", memory: 1536Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: model, mountPath: /app/outputs, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: model
          persistentVolumeClaim: {claimName: purchase-intent-model}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: {name: purchase-intent-api}
spec:
  type: ClusterIP
  selector: {app: purchase-intent-api}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: purchase-intent-api}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: purchase-intent-api}
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: purchase-intent-api}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: purchase-intent-api}
